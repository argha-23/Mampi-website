<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mampi ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <!-- Welcome Screen -->
        <section id="welcome-screen" class="screen active">

            <div class="welcome-card">

                <p class="small-text">A little something for you...</p>

                <h1>Hey Mampi ❤️</h1>

                <p class="intro-text">
                    Ready for something a little different? 👀
                </p>

                <button id="start-btn">
                    Let's Begin ❤️
                </button>

            </div>

        </section>


        <!-- Question Screen -->
        <section id="question-screen" class="screen">

            <div class="question-card">

                <div id="progress">
                    Question <span id="question-number">1</span>
                </div>

                <h2 id="question-text">
                    Question will appear here...
                </h2>

                <div id="answers"></div>

            </div>

        </section>


        <!-- Final Screen -->
        <section id="final-screen" class="screen">

            <div class="final-card">

                <h1>Thank You, Goru ❤️</h1>

                <p>
                    এতগুলো প্রশ্নের উত্তর দেওয়ার জন্য।
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
